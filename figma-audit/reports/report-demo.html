<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抖音商城设计组件使用周报</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Figtree:wght@300;400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:          #ffffff;
  --bg-raise:    #f7f7f5;
  --bg-card:     #fafaf8;
  --bg-hover:    #f3f3f0;
  --border:      #e8e6e0;
  --border-sub:  #f0eeea;
  --text-1:      #111010;
  --text-2:      #6b6862;
  --text-3:      #a09d97;
  --red:         #c0392b;
  --red-dim:     rgba(192,57,43,.08);
  --amber:       #b5720a;
  --amber-dim:   rgba(181,114,10,.08);
  --green:       #1e7d4e;
  --green-dim:   rgba(30,125,78,.08);
  --blue:        #2563eb;
  --blue-dim:    rgba(37,99,235,.08);
  --ff-display:  'Cormorant Garamond', Georgia, serif;
  --ff-body:     'Figtree', system-ui, sans-serif;
  --ff-mono:     'JetBrains Mono', monospace;
  --radius:      6px;
  --radius-lg:   10px;
  --transition:  220ms cubic-bezier(.4,0,.2,1);
}

html { font-size: 14px; scroll-behavior: smooth; }
body {
  font-family: var(--ff-body);
  background: var(--bg);
  color: var(--text-1);
  min-height: 100vh;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ── Layout ──────────────────────────────────────────────────────────── */
.shell {
  display: grid;
  grid-template-columns: 220px 1fr;
  grid-template-rows: auto 1fr;
  min-height: 100vh;
}

/* ── Header ──────────────────────────────────────────────────────────── */
header {
  grid-column: 1 / -1;
  border-bottom: 1px solid var(--border);
  padding: 0 32px;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--bg);
  position: sticky;
  top: 0;
  z-index: 20;
}
.header-brand {
  display: flex;
  align-items: baseline;
  gap: 14px;
}
.header-title {
  font-family: var(--ff-body);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .02em;
  color: var(--text-1);
}
.header-week {
  font-size: 11px;
  color: var(--text-3);
  font-weight: 400;
}
.header-meta {
  font-size: 11px;
  color: var(--text-3);
}

/* ── Sidebar ─────────────────────────────────────────────────────────── */
aside {
  border-right: 1px solid var(--border);
  padding: 20px 0;
  position: sticky;
  top: 52px;
  height: calc(100vh - 52px);
  overflow-y: auto;
}
.nav-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--text-3);
  padding: 0 20px 10px;
}
.nav-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 20px;
  cursor: pointer;
  border-left: 2px solid transparent;
  transition: background var(--transition), border-color var(--transition);
  gap: 8px;
}
.nav-item:hover { background: var(--bg-hover); }
.nav-item.active {
  background: var(--bg-raise);
  border-left-color: var(--text-1);
}
.nav-item.active .nav-name { color: var(--text-1); }
.nav-name {
  font-size: 12px;
  color: var(--text-2);
  line-height: 1.35;
  flex: 1;
  min-width: 0;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
.nav-badge {
  font-size: 10px;
  font-weight: 600;
  min-width: 20px;
  text-align: center;
  border-radius: 3px;
  padding: 1px 5px;
  flex-shrink: 0;
}
.nav-badge.high  { background: var(--red-dim);   color: var(--red); }
.nav-badge.mid   { background: var(--amber-dim); color: var(--amber); }
.nav-badge.low   { background: var(--bg-hover);  color: var(--text-3); }
.nav-badge.clean { background: var(--green-dim); color: var(--green); }
.nav-divider { height: 1px; background: var(--border); margin: 10px 20px; }

/* ── Main ────────────────────────────────────────────────────────────── */
main {
  padding: 36px 40px 60px;
  max-width: 860px;
}

/* ── View transitions ────────────────────────────────────────────────── */
.view {
  animation: fadeIn 200ms ease both;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── Page title ──────────────────────────────────────────────────────── */
.page-eyebrow {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 8px;
}
.page-title {
  font-family: var(--ff-display);
  font-size: 34px;
  font-weight: 300;
  color: var(--text-1);
  line-height: 1.15;
  margin-bottom: 4px;
  letter-spacing: -.01em;
}
.page-sub {
  font-size: 12px;
  color: var(--text-3);
  margin-bottom: 36px;
}

/* ── Stats strip ─────────────────────────────────────────────────────── */
.stats-strip {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  margin-bottom: 40px;
}
.stat-cell {
  background: var(--bg-card);
  padding: 20px 24px 18px;
}
.stat-num {
  font-family: var(--ff-display);
  font-size: 42px;
  font-weight: 300;
  line-height: 1;
  letter-spacing: -.02em;
  margin-bottom: 6px;
  position: relative;
  top: -3px;
}
.stat-num.red    { color: var(--red); }
.stat-num.amber  { color: var(--amber); }
.stat-num.green  { color: var(--green); }
.stat-num.plain  { color: var(--text-1); }
.stat-label {
  font-size: 11px;
  color: var(--text-3);
  font-weight: 400;
}

/* ── Section heading ─────────────────────────────────────────────────── */
.section-head {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 14px;
}
.section-title {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--text-2);
}
.section-count {
  font-size: 11px;
  color: var(--text-3);
}

/* ── File list ───────────────────────────────────────────────────────── */
.file-list { display: flex; flex-direction: column; gap: 0; }
.file-row {
  display: grid;
  grid-template-columns: 1fr 48px 48px 60px 48px 20px;
  column-gap: 20px;
  align-items: center;
  padding: 14px 18px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  transition: background var(--transition), border-color var(--transition);
}
.file-row:hover { background: var(--bg-hover); border-color: #30303a; }
.file-row + .file-row { margin-top: -1px; border-radius: 0; }
.file-row:first-child { border-radius: var(--radius) var(--radius) 0 0; }
.file-row:last-child  { border-radius: 0 0 var(--radius) var(--radius); }
.file-name {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-1);
  line-height: 1.3;
  padding-right: 16px;
}
.file-name-sub {
  font-size: 11px;
  color: var(--text-3);
  margin-top: 1px;
}
.file-col-num {
  font-family: var(--ff-body);
  font-size: 14px;
  font-weight: 500;
  text-align: center;
  line-height: 1;
  white-space: nowrap;
}
.file-col-num.c { color: var(--amber); }
.file-col-num.s { color: var(--blue); }
.file-col-num.l { color: var(--text-3); }
.file-col-total {
  font-family: var(--ff-body);
  font-size: 14px;
  font-weight: 600;
  text-align: center;
  white-space: nowrap;
  line-height: 1;
}
.file-col-total.high  { color: var(--red); }
.file-col-total.mid   { color: var(--amber); }
.file-col-total.clean { color: var(--green); }
.file-col-total.low   { color: var(--text-2); }
.file-arrow {
  font-size: 14px;
  color: var(--text-3);
  transition: transform var(--transition), color var(--transition);
}
.file-row:hover .file-arrow { transform: translateX(3px); color: var(--text-1); }
.file-list-header {
  display: grid;
  grid-template-columns: 1fr 48px 48px 60px 48px 20px;
  column-gap: 20px;
  padding: 0 18px 8px;
}
.file-list-header-cell {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--text-3);
  text-align: center;
  white-space: nowrap;
}
.file-list-header-cell:first-child { text-align: left; }

/* ── Detail view ─────────────────────────────────────────────────────── */
.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--text-3);
  cursor: pointer;
  margin-bottom: 28px;
  transition: color var(--transition);
  background: none;
  border: none;
  padding: 0;
  font-family: var(--ff-body);
}
.back-btn:hover { color: var(--text-1); }
.back-btn::before { content: '←'; font-size: 13px; }

.detail-meta-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 28px;
}
.detail-scanned { font-size: 11px; color: var(--text-3); }
.figma-link {
  font-size: 11px;
  color: var(--text-3);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  transition: color var(--transition);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 4px 10px;
}
.figma-link:hover { color: var(--text-1); border-color: #404050; }
.figma-link::after { content: '↗'; font-size: 10px; }

/* ── Tabs ────────────────────────────────────────────────────────────── */
.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
.tab-btn {
  font-family: var(--ff-body);
  font-size: 12px;
  font-weight: 500;
  color: var(--text-3);
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  padding: 10px 16px;
  cursor: pointer;
  margin-bottom: -1px;
  transition: color var(--transition), border-color var(--transition);
  display: flex;
  align-items: center;
  gap: 6px;
}
.tab-btn:hover { color: var(--text-2); }
.tab-btn.active { color: var(--text-1); border-bottom-color: var(--text-1); }
.tab-badge {
  font-size: 10px;
  font-weight: 600;
  background: var(--bg-hover);
  color: var(--text-3);
  border-radius: 3px;
  padding: 1px 5px;
  min-width: 18px;
  text-align: center;
}
.tab-btn.active .tab-badge { background: var(--border); color: var(--text-2); }

/* ── Issue table ─────────────────────────────────────────────────────── */
.issue-table { width: 100%; border-collapse: collapse; }
.issue-table th {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--text-3);
  padding: 0 12px 10px;
  text-align: left;
  border-bottom: 1px solid var(--border);
}
.issue-table th:first-child { padding-left: 0; }
.issue-table td {
  padding: 11px 12px;
  font-size: 12px;
  color: var(--text-2);
  border-bottom: 1px solid var(--border-sub);
  vertical-align: middle;
}
.issue-table td:first-child { padding-left: 0; }
.issue-table tr:last-child td { border-bottom: none; }
.issue-table tr:hover td { background: var(--bg-raise); }
.issue-node-name {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-1);
  margin-bottom: 2px;
}
.issue-path {
  font-family: var(--ff-mono);
  font-size: 10px;
  color: var(--text-3);
  line-height: 1.4;
}
.issue-suggest {
  font-size: 12px;
  color: var(--text-2);
}
.conf-pill {
  display: inline-block;
  font-size: 10px;
  font-weight: 600;
  border-radius: 3px;
  padding: 2px 7px;
}
.conf-pill.high  { background: var(--red-dim);   color: var(--red); }
.conf-pill.mid   { background: var(--amber-dim); color: var(--amber); }
.conf-pill.low   { background: var(--bg-hover);  color: var(--text-3); }
.kind-tag {
  font-size: 10px;
  color: var(--text-3);
  background: var(--bg-hover);
  border-radius: 3px;
  padding: 2px 6px;
  display: inline-block;
}

.issue-thumb {
  width: 56px;
  height: 40px;
  border-radius: 4px;
  background: var(--bg-hover);
  border: 1px dashed var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  overflow: hidden;
}
.issue-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 3px;
}
.issue-thumb-placeholder {
  font-size: 16px;
  color: var(--text-3);
  opacity: .5;
}
.locate-link {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  font-size: 11px;
  color: var(--blue);
  text-decoration: none;
  white-space: nowrap;
  opacity: .85;
  transition: opacity var(--transition);
}
.locate-link:hover { opacity: 1; text-decoration: underline; }
.locate-link::after { content: '↗'; font-size: 10px; }

.empty-state {
  padding: 40px 0;
  text-align: center;
  color: var(--text-3);
  font-size: 12px;
}
.empty-mark {
  font-family: var(--ff-display);
  font-size: 28px;
  font-weight: 300;
  color: var(--green);
  margin-bottom: 8px;
  display: block;
}

.severity-bar { display: none; }
.severity-bar-fill { display: none; }
</style>
</head>
<body>

<div class="shell">

  <!-- HEADER -->
  <header>
    <div class="header-brand">

  <!-- MAIN -->
  <main id="main"></main>

</div>

<script>

// ── Helpers ───────────────────────────────────────────────────────────────

function total(f) {
  // 布局建议不计入问题总数，仅组件匹配 + 样式问题
  return f.issues.component.length + f.issues.style.length;
}

function severityClass(n) {
  if (n === 0) return 'clean';
  if (n >= 7)  return 'high';
  if (n >= 4)  return 'mid';
  return 'low';
}

function navBadgeClass(n) {
  if (n === 0) return 'clean';
  if (n >= 7)  return 'high';
  if (n >= 4)  return 'mid';
  return 'low';
}

function countUp(el, target, duration) {
  const start = performance.now();
  const update = (now) => {
    const p = Math.min((now - start) / duration, 1);
    const ease = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(ease * target);
    if (p < 1) requestAnimationFrame(update);
  };
  requestAnimationFrame(update);
}

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Init ──────────────────────────────────────────────────────────────────

document.getElementById('headerMeta').textContent = '生成于 ' + REPORT.generatedAt;

// Build sidebar
const sidebarList = document.getElementById('sidebarList');
REPORT.files.forEach(f => {
  const t = total(f);
  const div = document.createElement('div');
  div.className = 'nav-item';
  div.id = 'nav-' + f.id;
  div.onclick = () => showDetail(f.id);
  div.innerHTML = `
    <span class="nav-name">${esc(f.name)}</span>
    <span class="nav-badge ${navBadgeClass(t)}">${t}</span>
  `;
  sidebarList.appendChild(div);
});

// ── Overview ──────────────────────────────────────────────────────────────

function showOverview() {
  setActiveNav('overview');
  const totalIssues = REPORT.files.reduce((s, f) => s + total(f), 0);
  const avg = (totalIssues / REPORT.files.length).toFixed(1);
  const cleanCount = REPORT.files.filter(f => total(f) === 0).length;

  const rowsHtml = REPORT.files.map(f => {
    const t = total(f);
    const sc = severityClass(t);
    const maxT = 10;
    const pct = Math.min(t / maxT, 1) * 100;
    const barColor = t === 0 ? 'var(--green)' : t >= 7 ? 'var(--red)' : t >= 4 ? 'var(--amber)' : 'var(--text-3)';
    return `
      <div class="file-row" onclick="showDetail('${esc(f.id)}')">
        <div>
          <div class="file-name">${esc(f.name)}</div>
          <div class="file-name-sub">扫描于 ${esc(f.scannedAt)}</div>
          <div class="severity-bar">
            <div class="severity-bar-fill" style="width:${pct}%;background:${barColor}"></div>
          </div>
        </div>
        <div class="file-col-num c">${f.issues.component.length || '—'}</div>
        <div class="file-col-num s">${f.issues.style.length || '—'}</div>
        <div class="file-col-num l">${f.issues.layout.length || '—'}</div>
        <div class="file-col-total ${sc}">${t === 0 ? '✓' : t}</div>
        <div class="file-arrow">→</div>
      </div>
    `;
  }).join('');

  document.getElementById('main').innerHTML = `
    <div class="view">
      <div class="page-title">${(d => `${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`)(new Date(REPORT.week.split(' ~ ')[1]))} 本周设计稿走查</div>
      <div class="page-sub">${esc(REPORT.week)}</div>

      <div class="stats-strip">
        <div class="stat-cell">
          <div class="stat-num plain" data-count="${REPORT.files.length}">0</div>
          <div class="stat-label">扫描设计稿</div>
        </div>
        <div class="stat-cell">
          <div class="stat-num ${totalIssues >= 10 ? 'red' : totalIssues >= 5 ? 'amber' : 'plain'}" data-count="${totalIssues}">0</div>
          <div class="stat-label">发现问题总数</div>
        </div>
        <div class="stat-cell">
          <div class="stat-num plain">${avg}</div>
          <div class="stat-label">平均每稿问题数</div>
        </div>
        <div class="stat-cell">
          <div class="stat-num green" data-count="${cleanCount}">0</div>
          <div class="stat-label">无问题设计稿</div>
        </div>
      </div>

      <div class="section-head">
        <span class="section-title">设计稿明细</span>
      </div>

      <div class="file-list-header">
        <div class="file-list-header-cell">需求名称</div>
        <div class="file-list-header-cell">组件</div>
        <div class="file-list-header-cell">样式</div>
        <div class="file-list-header-cell">布局建议</div>
        <div class="file-list-header-cell">合计</div>
        <div class="file-list-header-cell"></div>
      </div>
      <div class="file-list">${rowsHtml}</div>
    </div>
  `;

  // count-up animation
  document.querySelectorAll('[data-count]').forEach(el => {
    countUp(el, parseInt(el.dataset.count), 800);
  });
}

// ── Detail ────────────────────────────────────────────────────────────────

let activeTab = 'component';

function showDetail(fileId) {
  const file = REPORT.files.find(f => f.id === fileId);
  if (!file) return;
  setActiveNav(fileId);
  activeTab = file.issues.component.length > 0 ? 'component'
    : file.issues.style.length > 0 ? 'style' : 'layout';
  renderDetail(file);
}

function renderDetail(file) {
  const t = total(file);

  document.getElementById('main').innerHTML = `
    <div class="view">
      <button class="back-btn" onclick="showOverview()">返回本周报告</button>

      <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:4px">
        <div class="page-title" style="margin-bottom:0">${esc(file.name)}</div>
        <a class="figma-link" href="${esc(file.figmaUrl)}" target="_blank" style="flex-shrink:0;margin-bottom:4px">在 Figma 查看</a>
      </div>
      <div class="detail-scanned" style="margin-top:10px">扫描于 ${esc(file.scannedAt)}</div>

      <div class="stats-strip" style="margin-top:28px">
        <div class="stat-cell">
          <div class="stat-num ${t === 0 ? 'green' : t >= 5 ? 'amber' : 'plain'}" data-count="${t}">0</div>
          <div class="stat-label">问题总计</div>
        </div>
        <div class="stat-cell">
          <div class="stat-num plain" data-count="${file.issues.component.length}">0</div>
          <div class="stat-label">组件匹配</div>
        </div>
        <div class="stat-cell">
          <div class="stat-num plain" data-count="${file.issues.style.length}">0</div>
          <div class="stat-label">样式问题</div>
        </div>
        <div class="stat-cell">
          <div class="stat-num" style="color:var(--text-3)" data-count="${file.issues.layout.length}">0</div>
          <div class="stat-label">布局建议（参考）</div>
        </div>
      </div>

      <div class="tabs" style="margin-top:32px">
        <button class="tab-btn ${activeTab==='component'?'active':''}" onclick="switchTab('component','${esc(file.id)}')">
          组件匹配 <span class="tab-badge">${file.issues.component.length}</span>
        </button>
        <button class="tab-btn ${activeTab==='style'?'active':''}" onclick="switchTab('style','${esc(file.id)}')">
          样式问题 <span class="tab-badge">${file.issues.style.length}</span>
        </button>
        <button class="tab-btn ${activeTab==='layout'?'active':''}" onclick="switchTab('layout','${esc(file.id)}')">
          布局建议 <span class="tab-badge">${file.issues.layout.length}</span>
        </button>
      </div>

      <div id="tabContent">${renderTabContent(file, activeTab)}</div>
    </div>
  `;

  document.querySelectorAll('[data-count]').forEach(el => {
    countUp(el, parseInt(el.dataset.count), 600);
  });
}

function switchTab(tab, fileId) {
  activeTab = tab;
  const file = REPORT.files.find(f => f.id === fileId);
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  event.currentTarget.classList.add('active');
  document.getElementById('tabContent').innerHTML = renderTabContent(file, tab);
}

function figmaNodeUrl(fileUrl, nodeId) {
  // Build a direct Figma link: append node-id query param
  try {
    const u = new URL(fileUrl);
    if (nodeId) u.searchParams.set('node-id', nodeId);
    return u.toString();
  } catch (_) { return fileUrl; }
}

function thumbCell(nodeId, fileUrl) {
  const url = figmaNodeUrl(fileUrl, nodeId);
  // In production the src would be a Figma Images API URL.
  // For the prototype we show a styled placeholder.
  return `
    <td style="width:72px;padding-right:12px">
      <a href="${esc(url)}" target="_blank" title="在 Figma 中查看截图">
        <div class="issue-thumb">
          <span class="issue-thumb-placeholder">⬚</span>
        </div>
      </a>
    </td>`;
}

function locateCell(nodeId, fileUrl) {
  const url = figmaNodeUrl(fileUrl, nodeId);
  return `
    <td style="width:72px">
      <a class="locate-link" href="${esc(url)}" target="_blank">定位</a>
    </td>`;
}

function renderTabContent(file, tab) {
  if (tab === 'component') {
    if (!file.issues.component.length) return emptyState('组件使用规范');
    const rows = file.issues.component.map(i => `
      <tr>
        ${thumbCell(i.nodeId, file.figmaUrl)}
        <td>
          <div class="issue-node-name">${esc(i.name)}</div>
          <div class="issue-path">${esc(i.path)}</div>
        </td>
        <td><span class="issue-suggest">${esc(i.suggestion)}</span></td>
        <td><span class="conf-pill ${i.confidence}">${i.confidence === 'high' ? '高' : i.confidence === 'mid' ? '中' : '低'}</span></td>
        ${locateCell(i.nodeId, file.figmaUrl)}
      </tr>
    `).join('');
    return `<table class="issue-table"><thead><tr>
      <th style="width:72px">截图</th><th>元素</th><th>建议替换组件</th><th>置信度</th><th style="width:72px">定位</th>
    </tr></thead><tbody>${rows}</tbody></table>`;
  }

  if (tab === 'style') {
    if (!file.issues.style.length) return emptyState('文字与颜色样式');
    const rows = file.issues.style.map(i => `
      <tr>
        ${thumbCell(i.nodeId, file.figmaUrl)}
        <td>
          <div class="issue-node-name">${esc(i.name)}</div>
          <div class="issue-path">${esc(i.path)}</div>
        </td>
        <td><span class="kind-tag">${i.kind === 'text-style' ? '文字样式' : '颜色样式'}</span></td>
        <td><span class="issue-suggest" style="color:var(--text-3);font-size:11px">${esc(i.detail)}</span></td>
        <td><span class="issue-suggest">${esc(i.suggest)}</span></td>
        ${locateCell(i.nodeId, file.figmaUrl)}
      </tr>
    `).join('');
    return `<table class="issue-table"><thead><tr>
      <th style="width:72px">截图</th><th>元素</th><th>类型</th><th>问题描述</th><th>建议样式</th><th style="width:72px">定位</th>
    </tr></thead><tbody>${rows}</tbody></table>`;
  }

  if (tab === 'layout') {
    if (!file.issues.layout.length) return emptyState('布局与间距');
    const rows = file.issues.layout.map(i => `
      <tr>
        ${thumbCell(i.nodeId, file.figmaUrl)}
        <td>
          <div class="issue-node-name">${esc(i.name)}</div>
          <div class="issue-path">${esc(i.path)}</div>
        </td>
        <td><span class="kind-tag">${esc(i.kind)}</span></td>
        <td><span class="issue-suggest" style="color:var(--text-3);font-size:11px">${esc(i.detail)}</span></td>
        ${locateCell(i.nodeId, file.figmaUrl)}
      </tr>
    `).join('');
    return `<table class="issue-table"><thead><tr>
      <th style="width:72px">截图</th><th>元素</th><th>问题类型</th><th>说明</th><th style="width:72px">定位</th>
    </tr></thead><tbody>${rows}</tbody></table>`;
  }

  return '';
}

function emptyState(section) {
  return `<div class="empty-state">
    <span class="empty-mark">✓</span>
    ${esc(section)}无问题
  </div>`;
}

// ── Navigation ────────────────────────────────────────────────────────────

function setActiveNav(id) {
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  if (id === 'overview') {
    document.getElementById('sidebarOverview').classList.add('active');
  } else {
    const el = document.getElementById('nav-' + id);
    if (el) el.classList.add('active');
  }
}

// ── Boot ──────────────────────────────────────────────────────────────────
showOverview();
</script>
</body>
</html>
